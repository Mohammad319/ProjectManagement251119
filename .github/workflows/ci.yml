name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-test-security:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ProjectManagement/ProjectManagement/package-lock.json

      - name: Restore
        shell: pwsh
        run: dotnet restore "ProjectManagement.slnx"

      - name: Install web assets
        shell: pwsh
        working-directory: ProjectManagement/ProjectManagement
        run: npm ci

      - name: Build
        shell: pwsh
        run: dotnet build "ProjectManagement.slnx" --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test "ProjectManagement.slnx" --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Dependency vulnerability scan
        shell: pwsh
        run: dotnet list "ProjectManagement.slnx" package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
